<!DOCTYPE html>
<html>
<head>
    <title>Weight Converter</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
<div class="container">
    <h2>Weight Converter</h2>
    <label>Enter Weight:</label>
    <input type="number" id="weight"><br><br>
    <select id="unit">
        <option value="kgToG">Kilogram to Gram</option>
        <option value="gToKg">Gram to Kilogram</option>
        <option value="kgToLb">Kilogram to Pound</option>
        <option value="lbToKg">Pound to Kilogram</option>
    </select>
    <br><br>
    <div class="converter-buttons">
    <button onclick="convert()">Convert</button>
    <button onclick="window.location.href='resume.html'">Back</button>
</div>

<h3 id="result"></h3>
</div>
<script>
function convert(){
    let weight = Number(document.getElementById("weight").value);
    let unit = document.getElementById("unit").value;
    let answer;
    if(unit === "kgToG") answer = weight * 1000 + " g";
    else if(unit === "gToKg") answer = weight / 1000 + " kg";
    else if(unit === "kgToLb") answer = (weight * 2.205).toFixed(2) + " lb";
    else if(unit === "lbToKg") answer = (weight / 2.205).toFixed(2) + " kg";
    document.getElementById("result").innerHTML = "Result: " + answer;
}
</script>
</body>
</html>
