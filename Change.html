<!DOCTYPE html>
<html>
<head>
    <title>Change Calculator</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

<div class="small-container">

    <h2>Change Calculator</h2>

    <label>Enter Amount:</label>
    <input type="number" id="amount" min="1">

    <div class="change-buttons">
        <button onclick="calculate()">Calculate</button>
        <button onclick="window.location.href='resume.html'">Back</button>
    </div>

    <div id="result"></div>

</div>

<script>
function calculate(){

    let amount = parseInt(document.getElementById("amount").value);

    if(isNaN(amount) || amount < 1){
        document.getElementById("result").innerHTML =
        "Please enter a valid amount.";
        return;
    }

    let money = [1000,500,100,50,20,10,5,2,1];

    let names = [
        "$1000 note",
        "$500 note",
        "$100 note",
        "$50 note",
        "$20 note",
        "$10 coin",
        "$5 coin",
        "$2 coin",
        "$1 coin"
    ];

    let output = "<h3>Change</h3>";

    for(let i=0; i<money.length; i++){

        let count = Math.floor(amount / money[i]);

        if(count > 0){
            output += names[i] + " : " + count + "<br>";
            amount = amount % money[i];
        }
    }

    document.getElementById("result").innerHTML = output;
}
</script>

</body>
</html>
