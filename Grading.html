<!DOCTYPE html>
<html>
<head>
    <title>Grading</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

<div class="box">

    <h2>Calculate Grade</h2>

    <label>Enter Score:</label>
    <input type="number" id="score" min="0" max="100">

    <div class="grading-buttons">
        <button onclick="calculateGrade()">Submit</button>
        <button onclick="window.location.href='resume.html'">Back</button>
    </div>

    <p id="result"></p>

</div>

<script>
function calculateGrade(){

    let scoreValue = document.getElementById("score").value;
    let result = document.getElementById("result");

    if(scoreValue === ""){
        result.innerHTML = "Please enter a score.";
        return;
    }

    let score = Number(scoreValue);

    if(score < 0 || score > 100){
        result.innerHTML = "Please enter a score between 0 and 100.";
        return;
    }

    let grade;

    if(score >= 80)
        grade = "A";
    else if(score >= 70)
        grade = "B";
    else if(score >= 60)
        grade = "C";
    else if(score >= 50)
        grade = "D";
    else
        grade = "F";

    result.innerHTML = "You got an " + grade + "!";
}
</script>

</body>
</html>
